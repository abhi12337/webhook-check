# Tests for webhook-check itself.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Scan the demo project (expected to find issues)
        shell: bash
        run: |
          python examples/make_demo.py /tmp/demo-webhooks
          webhook-check scan /tmp/demo-webhooks --no-color && exit 1 || test $? -eq 1
      - name: Clean fixtures must pass
        run: webhook-check scan tests/fixtures/node_clean tests/fixtures/py_clean --no-color
      - name: The tool's own source must be clean
        run: webhook-check scan src --no-color --fail-on low
