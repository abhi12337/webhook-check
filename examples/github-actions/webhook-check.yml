# Copy to .github/workflows/webhook-check.yml in a repo that receives webhooks.
# Static only: it reads the checked-out files and never runs your code or sends a request.
name: webhook-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webhook-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin to a release tag or commit of webhook-check you have reviewed.
      - run: pipx install "git+https://github.com/OWNER/webhook-check@v0.1.0"
      - name: Check webhook handlers (fails on high/critical)
        run: webhook-check scan . --no-color --fail-on high
      - name: JSON report artifact
        if: always()
        run: webhook-check scan . --json --fail-on never > webhook-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webhook-check-report
          path: webhook-check.json
